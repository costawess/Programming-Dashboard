<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flowchart Throw Game (Sensor)</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        #debugVars {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            text-align: right;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 8px;
            line-height: 1.4;
        }

        /* Left: scene */
        #scene {
            flex: 3;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        /* Right: flowchart */
        #flowchart {
            flex: 2;
            background: #181818;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #flowchart svg {
            width: 100%;
            height: auto;
        }

        /* Controls on scene */
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(20, 20, 20, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        #controls label {
            margin-right: 5px;
        }

        #controls input {
            width: 40px;
            margin-right: 10px;
        }

        #controls button {
            margin-left: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        #controls button:hover {
            background: #555;
        }

        /* Scene elements */
        #ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 60px;
            height: 4px;
            background: #777;
        }

        #character {
            position: absolute;
            width: 30px;
            height: 60px;
            background: #4a90e2;
            bottom: 64px;
            border-radius: 6px;
        }

        #character::before {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #f0f0f0;
            top: -20px;
            left: 4px;
        }

        #ball {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff9800;
        }

        #hoop {
            position: absolute;
            width: 40px;
            height: 8px;
            border: 3px solid #ff4444;
            border-radius: 4px;
            bottom: 200px;
            left: 230px;
            background: transparent;
        }

        #backboard {
            position: absolute;
            width: 24px;
            height: 40px;
            background: #bbb;
            bottom: 208px;
            left: 248px;
        }

        /* Sensor display above the hoop */
        #sensor {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            bottom: 240px;
            left: 245px;
        }

        #message {
            position: absolute;
            left: 50%;
            top: 20%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.7);
            font-size: 22px;
            display: none;
        }

        /* Highlight for active SVG step */
        .active-step {
            fill: #8b5a00 !important;
            stroke: #ffcc33 !important;
        }
    </style>
</head>

    <script>
        // --- Constants for the "physics" in steps ---
        const CHAR_START_X = 80;
        const STEP_PIXELS = 10;
        const BALL_STEPS = 5;    // posição da bola a partir do boneco
        const THROW_STEPS = 10;  // posição de arremesso (walk2 correto)
        const BASKET_STEPS = 15; // posição da cesta (15 passos)

        // Geometria da cesta (deve bater com o CSS do #hoop)
        const HOOP_LEFT = CHAR_START_X + BASKET_STEPS * STEP_PIXELS; // 80 + 15*10 = 230
        const HOOP_BOTTOM = 200;   // "bottom: 200px" no CSS
        const HOOP_WIDTH = 40;     // "width: 40px" no CSS
        const HOOP_HEIGHT = 8;     // "height: 8px" no CSS
        const BALL_SIZE = 16;      // largura/altura do #ball

        // DOM elements
        const character = document.getElementById('character');
        const ball = document.getElementById('ball');
        const message = document.getElementById('message');
        const sensorEl = document.getElementById('sensor');
        const debugVarsEl = document.getElementById('debugVars');

        const walk1Input = document.getElementById('walk1');
        const walk2Input = document.getElementById('walk2');
        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');

        let state = 'IDLE';
        let charX = CHAR_START_X;
        let animationFrame = null;
        let hasBall = false;
        let sensorValue = 0;     // 0 ou 1 (lido do "sensor")
        let walkCount1 = 0;      // contador do primeiro loop
        let walkCount2 = 0;      // contador do segundo loop
        let collisionHit = false; // se a bola bateu na região de colisão da cesta

        // Mapa de índice lógico → id do SVG
        const flowStepIdMap = {
            0: 'step0',   // Start
            1: 'step1',   // User input
            2: 'step2',   // walkCount1 == walk1?
            3: 'step3',   // Walk (loop1)
            4: 'step4',   // Grab
            5: 'step21',  // walkCount2 == walk2?
            6: 'step32',  // Walk (loop2)
            7: 'step7',   // Throw
            8: 'step8',   // Read sensor
            9: 'step10',  // WON
            10: 'step11'  // LOST
        };

        // Lista de todos os ids que podem ser destacados
        const allSvgSteps = [
            'step0', 'step1', 'step2', 'step3', 'step4',
            'step21', 'step32', 'step7', 'step8', 'step9',
            'step10', 'step11'
        ];

        function setCharacterX(x) {
            charX = x;
            character.style.left = charX + 'px';
        }

        function setBallPosition(x, bottom) {
            ball.style.left = x + 'px';
            ball.style.bottom = bottom + 'px';
        }

        function highlightFlowStep(index) {
            // remove highlight de todos
            allSvgSteps.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('active-step');
            });

            // adiciona highlight ao passo ativo
            const targetId = flowStepIdMap[index];
            if (!targetId) return;
            const targetEl = document.getElementById(targetId);
            if (targetEl) targetEl.classList.add('active-step');
        }

        function showMessage(text, color) {
            message.style.display = 'block';
            message.textContent = text;
            message.style.color = color || '#fff';
        }

        function hideMessage() {
            message.style.display = 'none';
        }

        function updateSensorDisplay() {
            sensorEl.textContent = sensorValue;
            sensorEl.style.color = sensorValue ? '#00ff00' : '#cccccc';
        }

        function updateDebugPanel() {
            const w1 = parseInt(walk1Input.value, 10) || 0;
            const w2 = parseInt(walk2Input.value, 10) || 0;

            debugVarsEl.innerHTML =
                'walk1 = ' + w1 + '<br>' +
                'walk2 = ' + w2 + '<br>' +
                'walkCount1 = ' + walkCount1 + '<br>' +
                'walkCount2 = ' + walkCount2 + '<br>' +
                'sensor = ' + sensorValue;
        }

        function resetScene() {
            cancelAnimationFrame(animationFrame);
            state = 'IDLE';
            hasBall = false;
            sensorValue = 0;
            walkCount1 = 0;
            walkCount2 = 0;
            collisionHit = false;
            updateSensorDisplay();
            hideMessage();

            setCharacterX(CHAR_START_X);

            // Bola fixa a 5 passos do boneco
            const bx = CHAR_START_X + BALL_STEPS * STEP_PIXELS + 30;
            setBallPosition(bx, 80);

            highlightFlowStep(1); // mostra caixa "User input"
            updateDebugPanel();
        }

        // Utility to run a timed sequence
        function runSequence(steps) {
            let i = 0;
            function next() {
                if (i >= steps.length) {
                    state = 'IDLE';
                    return;
                }
                const { action, delay } = steps[i];
                action();
                i++;
                setTimeout(next, delay);
            }
            next();
        }

        function startProgram() {
            if (state === 'RUNNING') return;
            state = 'RUNNING';
            hideMessage();

            const w1 = parseInt(walk1Input.value, 10) || 0;
            const w2 = parseInt(walk2Input.value, 10) || 0;

            walkCount1 = 0;
            walkCount2 = 0;
            collisionHit = false;
            updateDebugPanel();

            // Apenas para coerência, mas finalX não é usado diretamente
            const finalX = CHAR_START_X + (w1 + w2) * STEP_PIXELS;

            const hoopX = CHAR_START_X + BASKET_STEPS * STEP_PIXELS;

            const willPickBall = (w1 === BALL_STEPS);
            const willThrowFromCorrectSpot = (w2 === THROW_STEPS);
            const shouldAimHoop = willPickBall && willThrowFromCorrectSpot;

            const handY = 120;
            const startBallX = finalX + 30;
            const startBallY = handY;

            const endBallX = shouldAimHoop
                ? (hoopX + HOOP_WIDTH / 2 - BALL_SIZE / 2)
                : (hoopX - 80);
            const endBallY = HOOP_BOTTOM + HOOP_HEIGHT;

            const frames = [];
            const totalFrames = 40;
            for (let i = 0; i < totalFrames; i++) {
                const t = i / (totalFrames - 1);
                const x = startBallX + (endBallX - startBallX) * t;
                const apexY = Math.max(startBallY, endBallY) + 80;
                const y = (1 - t) * (1 - t) * startBallY
                    + 2 * (1 - t) * t * apexY
                    + t * t * endBallY;
                frames.push({ x, y });
            }

            const seq = [];

            // 0 - Start
            seq.push({
                action: () => {
                    highlightFlowStep(0);
                    setCharacterX(CHAR_START_X);
                    const bx = CHAR_START_X + BALL_STEPS * STEP_PIXELS + 30;
                    setBallPosition(bx, 80);
                    hasBall = false;
                    sensorValue = 0;
                    updateSensorDisplay();
                },
                delay: 500
            });

            // 1 - Input
            seq.push({
                action: () => highlightFlowStep(1),
                delay: 500
            });

            // Loop walk1
            for (let step = 0; step < w1; step++) {
                seq.push({
                    action: () => highlightFlowStep(2),
                    delay: 80
                });
                seq.push({
                    action: () => {
                        highlightFlowStep(3);
                        setCharacterX(charX + STEP_PIXELS);
                        walkCount1++;
                        updateDebugPanel();
                    },
                    delay: 80
                });
            }

            // 4 - Grab
            seq.push({
                action: () => {
                    highlightFlowStep(4);
                    if (willPickBall) {
                        hasBall = true;
                        const bx = charX + 30;
                        setBallPosition(bx, 120); // bola na mão
                    } else {
                        hasBall = false;
                    }
                },
                delay: 600
            });

            // Loop walk2
            for (let step = 0; step < w2; step++) {
                seq.push({
                    action: () => highlightFlowStep(5),
                    delay: 80
                });
                seq.push({
                    action: () => {
                        highlightFlowStep(6);
                        setCharacterX(charX + STEP_PIXELS);
                        if (hasBall) {
                            const bx = charX + 30;
                            setBallPosition(bx, 120);
                        }
                        walkCount2++;
                        updateDebugPanel();
                    },
                    delay: 80
                });
            }

            // 7 - Throw
            seq.push({
                action: () => {
                    highlightFlowStep(7);
                    let idx = 0;
                    if (!hasBall) return;

                    function animateThrow() {
                        if (idx < frames.length) {
                            const f = frames[idx];
                            setBallPosition(f.x, f.y);

                            const centerX = f.x + BALL_SIZE / 2;
                            const centerY = f.y + BALL_SIZE / 2;

                            const hoopTop = HOOP_BOTTOM + HOOP_HEIGHT;
                            const collisionBandHeight = 12;

                            const withinX = centerX >= HOOP_LEFT &&
                                centerX <= HOOP_LEFT + HOOP_WIDTH;
                            const withinY = centerY >= hoopTop &&
                                centerY <= hoopTop + collisionBandHeight;

                            if (withinX && withinY) {
                                collisionHit = true;
                            }

                            idx++;
                            animationFrame = requestAnimationFrame(animateThrow);
                        }
                    }
                    animateThrow();
                },
                delay: 1200
            });

            // 8 - Read sensor
            seq.push({
                action: () => {
                    highlightFlowStep(8);
                    cancelAnimationFrame(animationFrame);
                    sensorValue = collisionHit ? 1 : 0;
                    updateSensorDisplay();
                    updateDebugPanel();
                },
                delay: 600
            });

            // 9 / 10 - Resultado
            seq.push({
                action: () => {
                    if (sensorValue === 1) {
                        highlightFlowStep(9);
                        showMessage("WIN! Sensor = 1", "#00ff00");
                    } else {
                        highlightFlowStep(10);
                        showMessage("LOST... Sensor = 0", "#ff4444");
                    }
                },
                delay: 1000
            });

            runSequence(seq);
        }

        btnStart.addEventListener('click', startProgram);
        btnReset.addEventListener('click', resetScene);

        // Initial
        resetScene();
    </script>
</body>
